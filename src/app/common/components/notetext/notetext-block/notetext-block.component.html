<ng-container *ngIf="note.parsedParts.length === 0; else noteLabel">
  <i>[ empty ]</i>
</ng-container>
<ng-template #noteLabel>
  <ng-container *ngFor="let part of note.parsedParts; let i = index">
    &nbsp;
    <!-- Markdown -->
    <ng-container *ngIf="part.type === 'text'; else component">
      <markdown [data]="note.rawText"></markdown>
    </ng-container>

    <!-- Reference -->
    <ng-template #component>
      <app-note-text [html]="getPartDisplayText(part)" [noteRef]="part.noteReference!"></app-note-text>
    </ng-template>
  </ng-container>
</ng-template>
