<ion-item color="light">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-label>
          Users
        </ion-label>
      </ion-col>
      <ion-col>
        <ion-label>
          Shared With
        </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="scroll-col">
        <ion-list>
          <ion-item *ngFor="let user of shareList" lines="none">
            <ion-button fill="clear" color="secondary" size="medium" (click)="addUser(user)" [disabled]="!controlInitialized">
              <ion-icon name="add-circle-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-label>{{user.username}}</ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
      <ion-col size="auto" style="align-self: center; flex-direction: column; display: flex;">
        <ion-icon name="arrow-forward-outline" size="small"></ion-icon>
        <ion-icon name="arrow-forward-outline" size="small"></ion-icon>
        <ion-icon name="arrow-forward-outline" size="small"></ion-icon>
      </ion-col>
      <ion-col class="scroll-col">
        <ion-list>
          <ion-item *ngFor="let user of selectedUsers" lines="none">
            <ion-button fill="clear" color="primary" size="medium" (click)="removeUser(user)" [disabled]="!controlInitialized">
              <ion-icon name="remove-circle-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-label>{{user.username}}</ion-label>
            <ion-icon name="share-outline" slot="end" color="subtlesecondary" size="small"></ion-icon>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-item>

<ion-button fill="clear" color="secondary" *ngIf="showDone" (click)="doneClickEvent()">Done</ion-button>
